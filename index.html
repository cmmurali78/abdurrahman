<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abdur Rahman | Coming Soon</title>
<style>
  :root { --bg: #000; --gold: #e6c05a; --gold-soft: #b8963e; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at center, #14110a 0%, var(--bg) 70%);
    color: var(--gold);
    font-family: Georgia, "Times New Roman", serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 8px;
  }
  .logo { width: min(640px, 90vw); height: auto; animation: fade 1.6s ease both; }
  .rule { width: 80px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 8px 0 20px; }
  h1 { font-weight: 400; font-size: clamp(1.1rem, 3.5vw, 1.8rem); letter-spacing: .5em; text-transform: uppercase; padding-left: .5em; animation: fade 1.6s .5s ease both; }
  p { color: var(--gold-soft); font-size: clamp(.9rem, 2.4vw, 1.1rem); letter-spacing: .08em; margin-top: 14px; animation: fade 1.6s .9s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
  <img class="logo" src="logo.jpg" alt="Abdur Rahman">
  <div class="rule"></div>
  <h1>Coming Soon</h1>
  <p>Something elegant is on its way.</p>
</body>
</html>
